<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bear Bot 🧸</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#111016;color:#fff;font-family:Arial,sans-serif;text-align:center}
.wrap{padding:22px 14px 30px;max-width:680px;margin:auto}
h1{font-size:36px;margin:8px 0 4px;font-weight:900;font-style:italic}
.sub{color:#8f8d94;font-size:21px;margin-bottom:24px}
.badges{display:flex;justify-content:flex-end;gap:8px;margin-bottom:4px}.badge{background:#2b2930;padding:11px 15px;border-radius:22px;font-weight:700}
.wheelbox{position:relative;width:min(92vw,570px);aspect-ratio:1;margin:12px auto 25px}
canvas{width:100%;height:100%;filter:drop-shadow(0 8px 15px #0008)}
.pointer{position:absolute;right:-3px;top:50%;transform:translateY(-50%);font-size:48px;color:#9b51ff;z-index:2}
.series{background:#29272d;border-radius:28px;padding:12px 8px;display:flex;justify-content:space-around;color:#aaa;font-weight:700}.active{background:white;color:#7653d9;padding:9px 14px;border-radius:24px}
.rewards{margin:14px 0;background:#252329;border-radius:22px;padding:12px;font-size:38px;white-space:nowrap;overflow:hidden}
.count{margin:28px 0;color:#aaa;font-size:20px;font-weight:700}
button{width:100%;border:0;border-radius:18px;padding:18px;font-size:22px;font-weight:800;color:white;background:#7835df;margin-top:8px}
.secondary{background:transparent;border:2px solid #555}.small{font-size:16px;color:#999;margin-top:12px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end}.sheet{background:#17161c;border-radius:30px 30px 0 0;width:100%;padding:35px 28px 30px}.prize{font-size:100px}.title{font-size:34px;font-weight:900}.text{font-size:20px;color:#aaa;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
<h1>КРУТИ КОЛЕСО</h1><div class="sub">И выигрывай подарки бесплатно</div>
<div class="badges"><div class="badge">🎁 Шанс</div><div class="badge">➕ +1 спин</div></div>
<div class="wheelbox"><canvas id="wheel" width="700" height="700"></canvas><div class="pointer">★</div></div>
<div class="series"><span>1 день</span><span>2 день</span><span class="active">3 день +1</span><span>4 день</span><span>5 день</span></div>
<div class="rewards">🧸 💝 🎁 🌹 🎂 💎</div>
<div class="count">Доступно прокрутов: <b id="spins">0</b></div>
<button id="spin">Крутить!</button>
<button class="secondary" id="invite">👥 Пригласить друга</button>
<div class="small" id="ref">Приглашено: 0 / 3</div>
</div>

<div class="modal" id="modal"><div class="sheet">
<div class="prize" id="prizeEmoji">🧸</div><div class="title" id="resultTitle">🎉 ПОЗДРАВЛЯЕМ!</div>
<div class="text" id="resultText">Ты выиграл подарок!</div>
<button id="claim">🎁 Забрать подарок</button>
<button class="secondary" id="close">Закрыть</button>
</div></div>

<script>
const tg=window.Telegram.WebApp; tg.ready(); tg.expand();
const initData=tg.initData;
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
let prizes=[], rotation=0, spinning=false;
const fallback=[
{id:'bear',name:'Мишка',emoji:'🧸',weight:50},{id:'gift',name:'Подарок',emoji:'🎁',weight:25},
{id:'rose',name:'Роза',emoji:'🌹',weight:15},{id:'cake',name:'Торт',emoji:'🎂',weight:9.989},
{id:'nft',name:'NFT-подарок',emoji:'💎',weight:.01},{id:'premium',name:'Telegram Premium',emoji:'⭐',weight:.001}
];

function draw(){
 const ps=prizes.length?prizes:fallback, n=ps.length, r=canvas.width/2, cx=r, cy=r;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);
 for(let i=0;i<n;i++){let a=i*2*Math.PI/n;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-35,a,a+2*Math.PI/n);ctx.closePath();ctx.fillStyle=i%2?'#eeeef4':'#dcdce6';ctx.fill();ctx.strokeStyle='#bcbac6';ctx.lineWidth=5;ctx.stroke();
  ctx.save();ctx.rotate(a+Math.PI/n);ctx.translate(r*.62,0);ctx.font='52px Arial';ctx.textAlign='center';ctx.fillText(ps[i].emoji,0,18);ctx.restore();}
 ctx.beginPath();ctx.arc(0,0,45,0,Math.PI*2);ctx.fillStyle='#ddd';ctx.fill();ctx.strokeStyle='#aaa';ctx.lineWidth=8;ctx.stroke();ctx.restore();
}
async function state(){
 try{let r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData})});let d=await r.json(); if(r.ok){prizes=d.prizes;spins.textContent=d.spins;ref.textContent=`Приглашено: ${d.referrals} / 3`; window.refLink=d.refLink; draw();}}
 catch(e){prizes=fallback;draw();}
}
spin.onclick=async()=>{
 if(spinning)return; spinning=true;
 try{
  let r=await fetch('/api/spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData})});
  let d=await r.json(); if(!r.ok){alert(d.detail==='NO_SPINS'?'Нет бесплатных прокруток. Пригласи 3 друзей!':'Ошибка');spinning=false;return;}
  const idx=prizes.findIndex(p=>p.id===d.prize.id), n=prizes.length, target=(idx+.5)*2*Math.PI/n;
  const start=rotation, end=rotation + 8*Math.PI + (2*Math.PI-target-(rotation%(2*Math.PI)));
  const t0=performance.now(), dur=4200;
  function anim(t){let p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);rotation=start+(end-start)*e;draw();if(p<1)requestAnimationFrame(anim);else{show(d.prize);spinning=false;state();}}
  requestAnimationFrame(anim);
 }catch(e){alert('Открой Mini App из Telegram.');spinning=false;}
};
function show(p){prizeEmoji.textContent=p.emoji;resultText.textContent='Ты выиграл: '+p.name+'!';modal.style.display='flex';}
claim.onclick=()=>{tg.openTelegramLink('https://t.me/peredoz08')};
close.onclick=()=>modal.style.display='none';
invite.onclick=()=>{if(window.refLink) tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(window.refLink)+'&text='+encodeURIComponent('Заходи в Bear Bot 🧸 и крути рулетку!'));else alert('Открой бота через Telegram.');};
state();
draw();
</script>
</body></html>
